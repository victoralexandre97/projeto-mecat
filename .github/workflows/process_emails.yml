name: Processar E-mails de Ausência e Publicar Dashboard

# Gatilho: qualquer push que adicione/altere PDFs na pasta dados/, ou disparo manual.
on:
  push:
    branches: [main]
    paths:
      - "dados/**.pdf"
  workflow_dispatch: {}

# Necessário para o job poder commitar de volta no repositório e publicar no Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pypdf pdfplumber

      - name: Executar pipeline de ETL (ler PDFs, deduplicar, gerar Excel + JSON)
        run: python scripts/process_data.py

      - name: Commit e push das alterações (banco Excel + dados.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(dados): atualiza banco de ausências e dados.json [skip ci]"
          file_pattern: "database/banco_ausencias.xlsx dados.json"
          commit_user_name: "mecat-dashboard-bot"
          commit_user_email: "actions@github.com"

      - name: Upload do artefato do site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
